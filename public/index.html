<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Live — Desktop Control Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Navbar -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">🎮</div>
        <div>
          <h1>Minecraft Live</h1>
          <span class="subtitle">Desktop Gift Test Control Panel</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="status-badge online">
          <span class="pulse-dot"></span>
          MC RCON Connected
        </div>
        <div id="tiktok-status-badge" class="status-badge offline">
          <span class="pulse-dot"></span>
          <span id="tiktok-status-text">TikTok Disconnected</span>
        </div>
        <button id="btn-start-war-2teams" class="btn btn-success" style="background: linear-gradient(135deg, #10B981, #059669); font-weight: 700;">
          ⚔️ START World War (2 Teams)
        </button>
        <button id="btn-test-all" class="btn btn-warning">
          🚀 Test Tất Cả Quà (Auto)
        </button>
      </div>
    </header>

    <!-- Control Bar (Tester Username & Combo Count & TikTok Connection) -->
    <section class="control-bar">
      <div class="input-group tiktok-group">
        <label for="input-tiktok-id">📱 TikTok ID (Live):</label>
        <div class="input-with-button">
          <input type="text" id="input-tiktok-id" placeholder="Nhập TikTok ID...">
          <button id="btn-connect-tiktok" class="btn btn-primary">
            🔗 Kết Nối Live
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="input-username">👤 Người Gửi (Tester Name):</label>
        <input type="text" id="input-username" value="StreamTester" placeholder="Nhập tên tester...">
      </div>

      <div class="input-group">
        <label>⚡ Số Lượng Combo (Count):</label>
        <div class="count-selector">
          <button class="count-chip active" data-count="1">x1</button>
          <button class="count-chip" data-count="5">x5</button>
          <button class="count-chip" data-count="10">x10</button>
          <button class="count-chip" data-count="20">x20</button>
          <button class="count-chip" data-count="50">x50</button>
          <input type="number" id="input-count" value="1" min="1" max="500">
        </div>
      </div>

      <div class="quick-action-group">
        <button id="btn-send-like" class="btn btn-secondary">
          ❤️ Gửi 500 Tim
        </button>
      </div>
    </section>

    <!-- World War 2 Teams & Comment Simulation Panel -->
    <section class="control-bar war-teams-bar" style="background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(59, 130, 246, 0.4); margin-bottom: 1.5rem; padding: 1rem 1.25rem; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <span style="font-size: 1.5rem;">⚔️</span>
        <div>
          <h3 style="margin: 0; font-size: 1.1rem; color: #60A5FA;">World War 2 Teams & Bắt Comment</h3>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Blue (~-16..~-1) vs Red (~..~15) | Streamer Overhead View</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
        <div class="input-group" style="margin: 0;">
          <label style="font-size: 0.8rem; margin-bottom: 2px;">💬 User Comment:</label>
          <input type="text" id="input-comment-user" value="Viewer99" placeholder="Tên Viewer..." style="width: 130px; padding: 6px 10px; font-size: 0.9rem;">
        </div>

        <div class="input-group" style="margin: 0;">
          <label style="font-size: 0.8rem; margin-bottom: 2px;">Nội dung (1 hoặc 2):</label>
          <input type="text" id="input-comment-text" value="1" placeholder="1 hoặc 2" style="width: 90px; padding: 6px 10px; font-size: 0.9rem; text-align: center; font-weight: 700;">
        </div>

        <button id="btn-send-comment" class="btn btn-primary" style="padding: 8px 14px; font-weight: 600;">
          💬 Gửi Comment
        </button>
        <button id="btn-quick-blue" class="btn" style="background: #2563EB; color: white; padding: 8px 12px; font-weight: 600;">
          🔵 Comment 1 (Team Xanh)
        </button>
        <button id="btn-quick-red" class="btn" style="background: #DC2626; color: white; padding: 8px 12px; font-weight: 600;">
          🔴 Comment 2 (Team Đỏ)
        </button>
      </div>

      <div style="display: flex; gap: 1rem; font-weight: 700; font-size: 0.95rem; background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 8px;">
        <span style="color: #60A5FA;">🔵 Xanh: <span id="cnt-team-blue">0</span></span>
        <span style="color: #F87171;">🔴 Đỏ: <span id="cnt-team-red">0</span></span>
      </div>
    </section>

    <!-- Main Workspace -->
    <main class="main-layout">
      <!-- Left Panel: Gifts Catalog -->
      <section class="catalog-section">
        <!-- Search & Category Filters -->
        <div class="filter-bar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Tìm kiếm quà (Corgi, Wither, Rosa, Overreact...)...">
          </div>

          <div class="category-tabs">
            <button class="tab-chip active" data-category="all">Tất Cả (<span id="count-all">0</span>)</button>
            <button class="tab-chip" data-category="gacha">🎲 Gacha</button>
            <button class="tab-chip" data-category="event">🐉 Sự Kiện Nối Tiếp</button>
            <button class="tab-chip" data-category="mob">🧟 Mobs & Bosses</button>
            <button class="tab-chip" data-category="item">🍎 Vật Phẩm & Buff</button>
            <button class="tab-chip" data-category="trap">💣 Bẫy Khống Chế</button>
          </div>
        </div>

        <!-- Gifts Grid (1-Click Trigger Cards) -->
        <div id="gifts-grid" class="gifts-grid">
          <!-- Dynamically populated by app.js -->
        </div>
      </section>

      <!-- Right Panel: Live Execution Terminal Log -->
      <aside class="console-section">
        <div class="console-header">
          <h3>💻 Live Console Log</h3>
          <button id="btn-clear-log" class="btn-icon" title="Xóa log">🗑️ Clear</button>
        </div>
        <div id="console-logs" class="console-logs">
          <!-- Log entries populated dynamically -->
        </div>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
